    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"Ministry of Papers","alternateName":"ministryofpapers.com","url":"https://ministryofpapers.com","description":"Free previous year question papers and mock tests for UPSC, SSC, IBPS, NEET, JEE and 240+ Indian competitive exams."}</script>
    <!-- favicon.ico first: Bing (and other crawlers) do not support SVG favicons
         and look for a real .ico at the domain root. Modern browsers still prefer
         the SVG below via the type hint. Apple needs a PNG, not SVG. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- The session check fires on every page load; warming the API origin
         saves a DNS+TLS round-trip (~300ms on mobile) off that request. -->
    <link rel="preconnect" href="https://api.ministryofpapers.com" crossorigin />
    <!-- Fraunces (serif DISPLAY font, headings) is SELF-HOSTED — see the
         @font-face rules in index.css. Preloading the latin woff2 from our own
         origin makes it ready at first paint, so the brand font renders on
         virtually every load (not just warm-cache ones). font-display: optional
         keeps font-driven CLS at zero — no mid-page swap that reflows headings.
         crossorigin is required even same-origin: fonts are fetched in CORS mode,
         so the preload must match to be reused (no double download). -->
    <link rel="preload" href="/fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!-- DM Sans (body) stays on Google Fonts with display=swap: its metrics are
         close to the system sans fallback, so the swap barely shifts. Loaded
         non-blocking (media="print" + onload flip) to stay off the critical path. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" />
    </noscript>
    <!-- Theme bootstrap: resolve light/dark BEFORE first paint so there is no
         flash. 'system' (or unset) follows the OS; 'light'/'dark' are explicit. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');       // 'light' | 'dark' | 'system'
          var signedIn = localStorage.getItem('mv.session') === '1';
          var onLanding = location.pathname === '/';
          var sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var pref = saved === 'dark' ? 'dark' : saved === 'system' ? sys : 'light';
          // Dark is a logged-in experience only, and never on the landing page.
          var theme = (signedIn && !onLanding && pref === 'dark') ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          var mc = document.querySelector('meta[name="theme-color"]');
          if (mc) mc.setAttribute('content', theme === 'dark' ? '#1E1E1E' : '#FAFAF7');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
